name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            cashier: '^14.6'
            testbench: '^8.0'
          - php: '8.2'
            cashier: '^15.3'
            testbench: '^9.0'
          - php: '8.3'
            cashier: '^16.0'
            testbench: '^10.0'
          - php: '8.3'
            cashier: '^16.0'
            testbench: '^11.0'
          - php: '8.4'
            cashier: '^16.0'
            testbench: '^11.0'
          - php: '8.5'
            cashier: '^16.0'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} / Cashier ${{ matrix.cashier }} / Testbench ${{ matrix.testbench }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, sqlite3
          coverage: none

      - name: Constrain dependencies for matrix
        run: |
          # Older matrix legs install EOL framework versions which Packagist
          # blocks via security advisories. This is dev-only compat testing,
          # nothing here ships to consumers.
          composer config policy.advisories.block false
          composer require "laravel/cashier:${{ matrix.cashier }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction

      - name: Run tests
        run: vendor/bin/phpunit
